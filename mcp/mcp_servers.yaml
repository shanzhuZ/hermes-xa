# MCP Server 基础配置（Hermes config.yaml 的 mcp_servers 段）
# Ubuntu 22.04 部署根目录：/opt/hermes-xa
# Python：仓库 venv  /opt/hermes-xa/.venv/bin/python
# Node：系统 node/npx（apt 或 nodesource）
# 合并：bash mcp/install.sh

mcp_servers:
  weibo:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/mcp-server-weibo
    args:
      - stdio
    env:
      WEIBO_COOKIE: ${WEIBO_COOKIE}
      NO_PROXY: '*.weibo.cn,weibo.cn,m.weibo.cn,passport.weibo.cn,visitor.passport.weibo.cn,localhost,127.0.0.1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  weixin_search:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/weixin_search_mcp
    args:
      - --transport
      - stdio
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  weixin_read:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/weixin-read-mcp/src/server.py
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  trends_hub:
    enabled: true
    command: npx
    args:
      - -y
      - mcp-trends-hub
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 120

  bilibili:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/bilibili-mcp-server/server.py
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  reddit:
    enabled: true
    command: npx
    args:
      - -y
      - reddit-mcp-buddy
    env:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  firecrawl:
    enabled: true
    command: npx
    args:
      - -y
      - firecrawl-mcp
    env:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  playwright:
    enabled: false
    command: npx
    args:
      - -y
      - '@playwright/mcp'
      - --timeout-navigation
      - '300000'
      - --timeout-action
      - '120000'
    env:
      PLAYWRIGHT_MCP_PROXY_SERVER: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 600
    connect_timeout: 180

  brightdata:
    enabled: false
    url: ${BRIGHTDATA_MCP_URL}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60

  apify:
    enabled: true
    command: npx
    args:
      - -y
      - '@apify/actors-mcp-server'
      - --actors
      - headlessagent/facebook-profile-post-scraper,clockworks/tiktok-scraper,apify/instagram-scraper,vujeen/telegram-channel-scraper,knotless_cadence/github-profile-scraper
    env:
      APIFY_TOKEN: ${APIFY_TOKEN}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: api.apify.com,apify.com,.apify.com
      no_proxy: api.apify.com,apify.com,.apify.com
    supports_parallel_tool_calls: false
    timeout: 600
    connect_timeout: 120

  maigret:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/maigret-mcp-server/server.py
    env:
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MAIGRET_REPORTS_DIR: /opt/hermes-xa/mcp/data/maigret-reports
      MAIGRET_PERSONA_GATE: '0'
      MAIGRET_PROXY: ${HTTPS_PROXY}
      MAIGRET_DEFAULT_TIMEOUT: '300'
      MAIGRET_MAX_TIMEOUT: '300'
    supports_parallel_tool_calls: false
    timeout: 360
    connect_timeout: 120

  user_scanner:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/user-scanner-mcp-server/run_user_scanner_mcp.py
    env:
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      USER_SCANNER_PROXY: ${HTTPS_PROXY}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      USER_SCANNER_CROSS_SCAN: '1'
    supports_parallel_tool_calls: false
    timeout: 600
    connect_timeout: 120
    tools:
      include:
        - scan_username
        - scan_email
        - list_available_modules

  pdl_person:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/pdl-person-mcp-server/server.py
    env:
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PDL_API_KEY: ${PDL_API_KEY}
      PDL_PROXY: ${HTTPS_PROXY}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      PDL_TIMEOUT: '60'
      PDL_MAX_SIZE: '25'
    supports_parallel_tool_calls: true
    timeout: 90
    connect_timeout: 60
    tools:
      include:
        - search_person

  twitter:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/twitter-mcp-server/run_twitter_mcp_data_only.py
    env:
      TWITTER_COOKIES: /opt/hermes-xa/mcp/data/twitter-cookies.json
      TWITTER_PROXY: ${HTTPS_PROXY}
      TWITTER_PERSONA_TOOLS: '0'
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 600
    connect_timeout: 60
    tools:
      include:
        - get_tweet
        - get_tweet_replies
        - search_tweets
        - search_user
        - get_user_info
        - get_user_tweets
        - get_user_followers
        - get_user_following
        - get_trends
        - get_timeline

  ocr:
    enabled: true
    command: /opt/hermes-xa/.venv/bin/python
    args:
      - /opt/hermes-xa/mcp/servers/ocr-mcp-server/run_ocr_mcp.py
    env:
      TESSERACT_CMD: /usr/bin/tesseract
      TESSDATA_PREFIX: /opt/hermes-xa/mcp/servers/ocr-mcp-server/tessdata
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 120
    connect_timeout: 120

  youtube:
    enabled: true
    command: node
    args:
      - /opt/hermes-xa/mcp/servers/youtube-mcp-server/dist/stdio-main.js
    env:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_COLLECT_MODE: '1'
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 180
    tools:
      include:
        - get-channel-stats
        - analyze-channel-videos
