# 图片原图存储
# Python 写：HTTP insertHbaseData；Java 读：ZK 原生（须与写入同一集群）
hermes:
  hbase:
    # 历史详情会短超时尝试读 HBase；失败自动回退本地，并冷却避免连环卡住
    enabled: ${HERMES_HBASE_ENABLED:true}
    zookeeper:
      # insertHbaseData(171:6666) 若落到 171 本机集群则用 192.168.3.171；若落到 hp1 则改 192.168.3.124
      quorum: ${HERMES_HBASE_ZK:192.168.3.171}
      port: ${HERMES_HBASE_ZK_PORT:2181}
    image-table: ${HERMES_HBASE_IMAGE_TABLE:collect_image_bytes}
    column-family: ${HERMES_HBASE_COLUMN_FAMILY:info}
    # 单次读/建连超时；超时后回退本地并进入冷却
    read-timeout-ms: ${HERMES_HBASE_READ_TIMEOUT_MS:3000}
    fail-cooldown-ms: ${HERMES_HBASE_FAIL_COOLDOWN_MS:60000}
    # 与 Python image_pipeline 本地双写目录一致
    local-dir: ${HERMES_IMAGE_LOCAL_DIR:D:/hermes-xa/data/image_bytes}
  # 视频：mp4 本地静态映射；抽帧进 HBase（frm: 前缀，同 collect_image_bytes）
  video:
    public-base-url: ${HERMES_VIDEO_PUBLIC_BASE_URL:http://192.168.100.39:4377}
    local-dir: ${HERMES_VIDEO_LOCAL_DIR:D:/hermes-xa/data/video_bytes}
    url-prefix: ${HERMES_VIDEO_URL_PREFIX:/video-files}
