server:
  port: 4377
  #171服务器
  #port: 8035
  tomcat:
    max-swallow-size: -1
    # 深分页查询耗时较长，避免 Tomcat 提前断开连接（10分钟）
    connection-timeout: 600000
  max-http-form-post-size: -1




ribbon:
  ReadTimeout: 30000;

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.aw.entity
  mapper-locations: classpath:mapper/*.xml



graphiql:
  enabled: true

spring:
  application:
    name: hermes
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/hermes-xa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

