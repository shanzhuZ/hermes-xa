model:
  # 主对话/Agent：全程 GPT（密钥 OPENAI_API_KEY）
  default: gpt-5.4
  provider: openai-api
  api_mode: codex_responses
agent:
  max_turns: 150
  image_input_mode: auto
  verbose: false
  reasoning_effort: medium
  system_prompt: '用户用中文与你交流时，你必须全程使用简体中文回复，包括：

    - 工具调用前的进度说明（步骤 1～6 最多 2 句，用中文）

    - 中间推理与状态说明

    - 最终输出报告

    禁止用英文叙述采集步骤或写英文调查报告。已加载 Skill 时严格遵守其中文输出格式与三节结构。

    '
  personalities:
    helpful: 你是 Hermes 数据采集助手。用户用中文时全程简体中文；遵守已加载 Skill 的步骤与输出格式；禁止英文调查报告体。
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  cloud_provider: local
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: pplx
    model: sonar
    timeout: 120
    download_timeout: 60
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  write_approval: true
  creation_nudge_interval: 0
command_allowlist:
  - script execution via -e/-c flag
  - recursive delete
hooks:
  pre_llm_call:
  - command: D:/environment/python/python.exe D:/hermes-xa/scripts/db_sink.py
    timeout: 120
  pre_tool_call:
  - command: D:/environment/python/python.exe D:/hermes-xa/scripts/db_sink.py
    timeout: 120
  post_tool_call:
  - command: D:/environment/python/python.exe D:/hermes-xa/scripts/db_sink.py
    timeout: 120
  post_llm_call:
  - command: D:/environment/python/python.exe D:/hermes-xa/scripts/db_sink.py
    timeout: 120
  on_session_end:
  - command: D:/environment/python/python.exe D:/hermes-xa/scripts/db_sink.py
    timeout: 120
hooks_auto_accept: true
hooks_auto_accept: true
hooks_auto_accept: true
hooks_auto_accept: true
code_execution:
  timeout: 300
  max_tool_calls: 50
tools:
  tool_search:
    enabled: false
streaming:
  enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
mcp_servers:
  weibo:
    enabled: true
    command: D:/environment/python/Scripts/mcp-server-weibo.exe
    args:
      - stdio
    env:
      WEIBO_COOKIE: ${WEIBO_COOKIE}
      NO_PROXY: '*.weibo.cn,weibo.cn,m.weibo.cn,passport.weibo.cn,visitor.passport.weibo.cn,localhost,127.0.0.1'
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  weixin_search:
    enabled: true
    command: D:/environment/python/Scripts/weixin_search_mcp.exe
    args:
      - --transport
      - stdio
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  weixin_read:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/weixin-read-mcp/src/server.py
    env:
      PATH: C:/Users/zhr/.url-md/bin;${PATH}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  # Pplx/Sonar 对 tools 数量有硬上限（约 ≤134）。trends_hub 占 ~21 个且账号任务不需要，先关掉。
  trends_hub:
    enabled: false
    command: D:/environment/node/node_cache/mcp-trends-hub.cmd
    args: []
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 120
  bilibili:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/bilibili-mcp-server/server.py
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  reddit:
    enabled: true
    command: D:/environment/node/node_cache/reddit-mcp-buddy.cmd
    args: []
    env:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  # Skill 已 forbid firecrawl；再占 ~20 个 tools，易触发 Perplexity invalid request，默认关掉。
  firecrawl:
    enabled: false
    command: D:/environment/node/node_cache/firecrawl-mcp.cmd
    args: []
    env:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  playwright:
    enabled: false
    command: D:/environment/node/node_cache/playwright-mcp.cmd
    args:
      - --timeout-navigation
      - '300000'
      - --timeout-action
      - '120000'
    env:
      PLAYWRIGHT_MCP_PROXY_SERVER: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 600
    connect_timeout: 180
  brightdata:
    enabled: false
    url: ${BRIGHTDATA_MCP_URL}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 60
  apify:
    enabled: true
    command: D:/environment/node/node_cache/actors-mcp-server.cmd
    args:
      - --actors
      - headlessagent/facebook-profile-post-scraper,clockworks/tiktok-scraper,apify/instagram-scraper,vujeen/telegram-channel-scraper,knotless_cadence/github-profile-scraper
    env:
      APIFY_TOKEN: ${APIFY_TOKEN}
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      NO_PROXY: api.apify.com,apify.com,.apify.com
      no_proxy: api.apify.com,apify.com,.apify.com
    supports_parallel_tool_calls: false
    timeout: 600
    connect_timeout: 120
  maigret:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/maigret-mcp-server/server.py
    env:
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MAIGRET_REPORTS_DIR: D:/hermes-xa/mcp/data/maigret-reports
      MAIGRET_PERSONA_GATE: '0'
      MAIGRET_PROXY: ${HTTPS_PROXY}
      MAIGRET_DEFAULT_TIMEOUT: '300'
      MAIGRET_MAX_TIMEOUT: '300'
    supports_parallel_tool_calls: false
    timeout: 360
    connect_timeout: 120
  es-search:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/es-search/server.py
    env:
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      ES_HOST: ${ES_HOST}
      ES_USERNAME: ${ES_USERNAME}
      ES_PASSWORD: ${ES_PASSWORD}
    supports_parallel_tool_calls: true
    timeout: 120
    connect_timeout: 30
  twitter:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/twitter-mcp-server/run_twitter_mcp_data_only.py
    env:
      TWITTER_COOKIES: C:/Users/zhr/.config/twitter-mcp/cookies.json
      TWITTER_PROXY: ${HTTPS_PROXY}
      TWITTER_PERSONA_TOOLS: '0'
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 600
    connect_timeout: 60
    tools:
      include:
        - get_tweet
        - get_tweet_replies
        - search_tweets
        - search_user
        - get_user_info
        - get_user_tweets
        - get_user_followers
        - get_user_following
        - get_trends
        - get_timeline
  ocr:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/ocr-mcp-server/run_ocr_mcp.py
    env:
      TESSERACT_CMD: C:/Program Files/Tesseract-OCR/tesseract.exe
      TESSDATA_PREFIX: D:/hermes-xa/mcp/servers/ocr-mcp-server/tessdata
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      FASTMCP_SHOW_SERVER_BANNER: 'false'
    supports_parallel_tool_calls: true
    timeout: 120
    connect_timeout: 120
  youtube:
    enabled: true
    command: C:/nvm4w/nodejs/node.exe
    args:
      - D:/hermes-xa/mcp/servers/youtube-mcp-server/dist/stdio-main.js
    env:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_COLLECT_MODE: '1'
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
    supports_parallel_tool_calls: true
    timeout: 180
    connect_timeout: 180
    tools:
      include:
        - get-channel-stats
        - analyze-channel-videos
  # 独立视频抽帧分析 MCP（01 由 Hook 后台调用，禁止 Agent 同步长等）
  video2frame:
    enabled: true
    command: D:/environment/python/python.exe
    args:
      - D:/hermes-xa/mcp/servers/video2frame-mcp/server.py
    env:
      HERMES_HOME: D:/hermes-xa
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      HERMES_VIDEO_VLM_API_URL: https://api.perplexity.ai/chat/completions
      HERMES_VIDEO_VLM_MODEL: sonar
      HERMES_VIDEO_FRAME_INTERVAL_SEC: '3'
      HERMES_VIDEO_MAX_ANALYZE_SEC: '120'
      # YouTube 反爬：Netscape cookies.txt（勿提交 git）
      HERMES_VIDEO_YTDLP_COOKIES: D:/hermes-xa/mcp/data/youtube-cookies.txt
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      HERMES_VIDEO_PROXY: ${HTTPS_PROXY}
      FASTMCP_SHOW_SERVER_BANNER: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    supports_parallel_tool_calls: false
    timeout: 900
    connect_timeout: 120
    tools:
      include:
        - download_video
        - extract_frames
        - analyze_frames
        - run_video_pipeline
custom_providers:
  - name: google
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GOOGLE_API_KEY
    api_mode: chat_completions
    models:
      gemini-2.0-flash:
        context_length: 1048576
      gemini-2.5-flash:
        context_length: 1048576
  # Vision / OCR 用，密钥：PERPLEXITY_API_KEY
  - name: pplx
    base_url: https://api.perplexity.ai
    key_env: PERPLEXITY_API_KEY
    api_mode: chat_completions
    models:
      sonar:
        context_length: 128000
      sonar-pro:
        context_length: 200000
  # 主 Agent 用，密钥：PERPLEXITY_AGENT_API_KEY（与 vision 分开）
  - name: pplx-agent
    base_url: https://api.perplexity.ai
    key_env: PERPLEXITY_AGENT_API_KEY
    api_mode: chat_completions
    models:
      sonar:
        context_length: 128000
      sonar-pro:
        context_length: 200000
  - name: local-ds
    base_url: http://172.200.200.4:7000/v1
    api_key: sk-dummy
    api_mode: chat_completions
    models:
      ds:
        context_length: 262144
      deepseek-v4-flash:
        context_length: 1000000
known_plugin_toolsets:
  cli:
    - spotify

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
