# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  鈥?routes to any model
#   openai-codex (OAuth 鈥?hermes auth) 鈥?OpenAI Codex
#   nous         (OAuth 鈥?hermes auth) 鈥?Nous Portal
#   zai          (ZAI_API_KEY)         鈥?Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        鈥?Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   鈥?Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     鈥?MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  鈥?MiniMax (China)
#   bedrock      (AWS IAM / boto3)     鈥?AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
