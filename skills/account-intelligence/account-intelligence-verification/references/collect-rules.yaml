# 01 账号采集 — 唯一参考（Skill 只加载本文件）
version: "1.12.0"

identity: 用户指定的多个 @种子账号 作为目标；禁止把 Maigret/简介里其他 handle 当种子。

forbidden_always:
  tools: [web_search, web_extract, browser_*, clarify, mcp_firecrawl_*]
  output: [综合画像, 用户画像, 综合介绍, 发展轨迹, 各方评价, 如果你想进一步了解, 四、]

steps:
  "1_seed":
    do: 多平台 MCP profile
    forbid: [get_user_tweets, maigret, vision]

  "2_profiles":
    do: |
      遍历 summary.accounts 所有账号：
      - 有 MCP
          Twitter使用mcp__twitter__get_user_info 获取主页数据采集
          YouTube使用mcp__youtube__get_channel_stats + channelId 获取主页信息，禁止 analyze_channel_videos
          bilibili（B站）使用 mcp__bilibili__get_user_info 获取主页数据采集
      - 无 MCP
          Instagram/TikTok/Telegram/Facebook/GitHub  使用Apify mcp__apify__get_actor_run 获取 主页信息
      - discovery_only（Discord/ImgInn 等）：只记 URL
      失败/空数据→跳过该候选，禁止 web_search，禁止重试超过 1 次
    forbid: [maigret, get_user_tweets, get_user_feeds, analyze_channel_videos, youtube search, vision, ocr, web_search, web_extract, browser_*, clarify, mcp_firecrawl_*]

  "3_contents":
    do: |
      遍历 summary.accounts 所有账号，采集展示近30天的所有发言内容：
      - 有 MCP：
          Twitter使用mcp__twitter__get_user_tweets
          微博
          B站（bilibili）使用mcp__bilibili__get_video_info
          YouTube使用mcp__youtube__analyze_channel_videos
      - 无 MCP：
          Instagram/TikTok/Telegram/Facebook/GitHub  使用 Apify mcp__apify__get_dataset_items 三轮（resultsLimit≤5）
      失败/空数据→跳过该候选，禁止 web_search，禁止重试超过 1 次
    forbid: [maigret, web_search, web_extract, browser_*, clarify, mcp_firecrawl_*, youtube search, vision, ocr, 任何报告文字]

  "4_analysis_content":
    do: |
      结合账号对应平台发言：
        - 分析账号发言观点
        - 总结账号发言风格
    forbid: [web_search, web_extract, browser_*, clarify, mcp_firecrawl_*]

  "5_streams":
    do: |
      结合对步骤2采集账号主页信息 与 步骤4账号发言观点与发言风格，同时展开一下分析：
        - 文本流：昵称/handle/简介/互链/邮箱/码值/电话 → 使用账号主页信息做多组合对比
        - 图片流：有 avatar_url → 各 1 次 mcp_ocr_perform_ocr + vision_analyze
    forbid: [发文工具, 写最终报告]

  "6_validated":
    do: validated_accounts = 账号的文本/图片流相似的候选（high/medium）；其余进 excluded
    forbid: [一切发文工具]

  "7_output":
    once: true
    sections: [一、个人信息, 二、各个平台账号发言及发言观点, 三、账号核验结果及依据]
    section2: [3.1文本流表, 3.2图片流表, 3.3高匹配度的同一人账号, 3.4低匹配度的账号]
    section3: 每平台一块，MCP/Apify 原文逐条，禁止主题归纳

apify:
  contract: [mcp_apify_<actor>, mcp_apify_get_actor_run, mcp_apify_get_dataset_items]
  instagram: { tool: mcp_apify_apify__instagram_scraper, input: { directUrls: ["https://www.instagram.com/{u}/"], resultsLimit: 5 } }
  tiktok: { tool: mcp_apify_clockworks__tiktok_scraper, input: { profiles: ["https://www.tiktok.com/@{u}"], resultsPerPage: 5 } }
  telegram: { tool: mcp_apify_vujeen__telegram_channel_scraper, input: { channels: ["{ch}"], maxPostsPerChannel: 3 } }
  facebook: { tool: mcp_apify_headlessagent__facebook_profile_post_scraper }
  github: { tool: mcp_apify_knotless_cadence__github_profile_scraper }

midflight: 步骤1-6 对用户展示 全部 进度，描述尽可能详细；
