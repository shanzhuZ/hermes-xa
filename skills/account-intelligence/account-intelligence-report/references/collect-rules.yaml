# 04 账号画像写报 — 唯一参考（Skill 只加载本文件）
version: "1.21.0"

identity: 用户指定的 @种子 为唯一目标；禁止把 Maigret/简介里其他 handle 当种子。

# 注意：web_search/web_extract/browser_* 仅步骤3允许，其余步骤各自在 forbid 里禁用（不放全局，避免与步骤3冲突）
forbidden_always:
  tools: [clarify, mcp_firecrawl_*]
  output: [综合画像, 用户画像, 综合介绍, 发展轨迹, 各方评价, 如果你想进一步了解, 五、, 图片资产管线系统未部署, 跳过步骤 7.5, image_pipeline未部署]

# 硬顺序：7_posts 结束后必须 7_5_image_assets，再进 8/9/10
mandatory_auto_steps: [5_streams, 6_validated, 7_posts, 7_5_image_assets, 8_img_analysis, 9_context_analysis, 10_context_analysis, 11_output]

steps:
  "1_seed":
    do: |
      按用户指定的种子平台采主页（MCP 或 Apify，与 01 一致）：
      【MCP】
      - twitter → mcp_twitter_get_user_info(screen_name=种子handle)
      - weibo   → mcp_weibo_get_profile
      - youtube → mcp_youtube_get_channel_stats(channelId=…)
      - bilibili→ mcp_bilibili_get_user_info(uid=数字uid)
      【Apify，必须走三轮：Actor → get_actor_run → get_dataset_items】
      - instagram → mcp_apify_apify__instagram_scraper
        input: { directUrls: ["https://www.instagram.com/{u}/"], resultsLimit: 5 }
      - tiktok → mcp_apify_clockworks__tiktok_scraper
        input: { profiles: ["https://www.tiktok.com/@{u}"], resultsPerPage: 5 }
      - telegram → mcp_apify_vujeen__telegram_channel_scraper
        input: { channels: ["{ch}"], maxPostsPerChannel: 3 }（ch=@名或 t.me/xxx）
      - facebook → mcp_apify_headlessagent__facebook_profile_post_scraper
        input: { profileUrls: ["https://www.facebook.com/{u}"], postUrls: [] }
      - github → mcp_apify_knotless_cadence__github_profile_scraper
        input: { usernames: ["{u}"], maxRepos: 5 }
      Apify 种子：Actor 启动成功后轮询 get_actor_run，再 get_dataset_items 取 profile；禁止因「无 MCP」跳过；种子步只取主页，发文留到步骤7。
    forbid: [get_user_tweets, maigret, vision, web_search, web_extract, browser_*]

  "2_maigret":
    when: 用户说跨平台
    do: |
      仅调用 mcp_maigret_collect_accounts(username=种子handle)。
      读 summary.accounts + agent_must_do_next（若有），写入候选供步骤3合并去重。
    tool: mcp_maigret_collect_accounts
    tool_args: { username: "<种子handle，不含@>" }
    forbid_tools:
      - mcp_maigret_search_username
      - mcp_maigret_search_usernames
      - mcp_maigret_get_prompt
      - search_username
      - search_usernames
    forbid: 写报告；follow collect_skill_mode / agent_must_do_next；禁 web_search/web_extract/browser_*

  "3_web_search":
    do: |
      使用种子账号的昵称 + handle，浏览器 + 搜索引擎 [web_search, web_extract, browser_*] 检索社交账号。
      严查：推特(X)/facebook/telegram/youtube/github/reddit/weibo/linkedin/instagram/vk 等中大型社交网站。
    then: |
      将本步 web_search 发现的候选与步骤2 Maigret 的 summary.accounts 合并，按 平台+handle 去重，
      形成「统一候选列表」，供步骤4遍历（此步是全流程唯一允许 web_search/web_extract/browser_* 的步骤）

  "4_profiles":
    do: |
      遍历步骤3产出的「统一候选列表」每条候选（种子平台除外）：
      - 有 MCP：Twitter/微博/B站/YouTube→仅 profile（YouTube 用 get_channel_stats + channelId，禁止 analyze_channel_videos）
      - 无 MCP：Instagram/TikTok/Telegram/Facebook/GitHub→Apify 三轮（resultsLimit≤5，只取 profile 字段）
      - discovery_only（Discord/ImgInn 等）：只记 URL
      失败/空数据→跳过该候选，禁止 web_search，禁止重试超过 1 次
    forbid: [get_user_tweets, get_user_feeds, analyze_channel_videos, youtube search, vision, ocr, 任何报告文字, web_search, web_extract, browser_*]

  "5_streams":
    do: |
      4.1 信息核验（父壳 step5_streams）：
      4.1.1 文本流核验：系统规则比对；Agent 输出以 [文本核验结论] 开头的正文（禁止工具收口）
      4.1.2 图片流核验：系统 image_pipeline 入库+分析；完成后 collect_images 可渲染才 completed；无图 skipped
      两子都终态后父壳 completed → 步骤6；步骤5未完成禁止发文工具
      （步骤5只产出核查数据，不输出报告章节）
    forbid: [发文工具, get_user_tweets, analyze_channel_videos, get_user_feeds, mcp_weibo_get_feeds, mcp_apify_get_dataset_items发文轮, 写最终报告, web_search, web_extract, browser_*]

  "6_validated":
    do: |
      validated_accounts = 种子 + 与种子文本/图片流相似的候选（high/medium）；其余进 excluded。
      本步完成前禁止一切发文工具；完成后进入 4.3 社工库核验（不是直接发文）。
    forbid: [一切发文工具, get_user_tweets, analyze_channel_videos, get_user_feeds, web_search, web_extract, browser_*, search_country_wise]

  "6_osint_es":
    do: |
      4.3 社工库核验（step6_osint_es）：主路径由系统自动查 ES（kickoff），不依赖 Agent。
      Agent 若见待查 URL 可补调 mcp_es_search_search_country_wise(query_text=profile_url，按需 field；可选 person_name)。
      禁止默认跑 search_facebook / search_worldpeople。
      系统收口：有命中 completed；无命中 skipped（不阻塞步骤7）。
      可选输出 [社工库核验结论]；4.3 未终态禁止发文工具。
    forbid: [一切发文工具, get_user_tweets, analyze_channel_videos, get_user_feeds, web_search, web_extract, browser_*, search_facebook, search_worldpeople]

  "7_posts":
    do: |
      【硬强制·UI步骤5】本回合唯一合法动作=调用发文工具；上下文「必须立即调用」列表须本回合并行调完。
      每个 validated（含种子）必须先真实调用对应发文工具，禁止未调用就收口/进分析/结束会话/口头完成。
      平台工具：
      - twitter→mcp_twitter_get_user_tweets(约50条)；get_user_info 不算
      - youtube→mcp_youtube_analyze_channel_videos(channelId=UC…)；get_channel_stats 不算
      - weibo→mcp_weibo_get_user_feeds；get_profile 不算
      - Instagram/TikTok/Telegram/Facebook/GitHub→Apify Actor→run→dataset（phase=step7_post_*）；步骤1/4 主页 dataset 不算
      【种子】发文约 50 条；【其余 validated】同上。
      允许：工具已调用但失败或 0 条再 skip。禁止：未调用就宣称完成。
      全部发文工具调用结束后必须进入 7_5_image_assets，禁止直接写步骤8～11。
      说明：发文入库后 Hook 可能自动挂 5.1.x.1 视频子节点；禁止调用 mcp_video2frame_*。
    forbid: [web_search, web_extract, browser_*, clarify, mcp_firecrawl_*, 写最终报告, mcp_video2frame_run_video_pipeline, mcp_video2frame_download_video, 未调用发文工具就进分析, 结束会话空过发文]

  "7_5_image_assets":
    require_before: [7_posts]
    do: |
      图片资产入库 + 分析回填（硬门槛，步骤树无独立节点）：
      1) 取得 task_id（Gateway task:{uuid} 或会话活跃任务）
      2) 禁止 search_files / web_search 探测「是否部署」；scripts/image_pipeline 视为已部署
      3) 在 scripts/ 下执行：
         python -m image_pipeline.run --task-id <taskId> --force-analyze
      4) 返回 JSON 摘要最多 1 句进度；失败只记日志，禁止把整任务判 failed
      5) 完成后进入步骤8/9/10；禁止跳过直接写分析或终稿
    forbid: [写最终报告, web_search, web_extract, browser_*, clarify]

  "8_img_analysis":
    require_before: [7_5_image_assets]
    do: |
      图片分析： 头像、背景图片、发文配图 的内容构成。分析点位：地点、人物、喜好、习惯；
      - 优先结合 collect_images / GET /api/tasks/{taskId}/images 已入库结果
      - 缺图时可用 vision_analyze，禁止对未入库临时 CDN 空跑全量
    forbid: [ web_search, web_extract, browser_*, clarify, mcp_firecrawl_* ]

  "9_context_analysis":
    require_before: [7_5_image_assets]
    do: |
      发文文本分析：集合全网平台（validated_accounts）的发文信息，归纳发文观点与涉华倾向。
      输出要求：
      - 归纳若干（建议 3～6 个）核心观点，每个观点：
        · 观点描述（1 句概括）
        · 支撑发文：至少 3 条原文佐证，格式「YYYY年MM月DD日 在 XX平台 发文称："原文摘录"」
      - 只用步骤7采到的发文原文，禁止无出处的主观归纳
    forbid: [ web_search, web_extract, browser_*, clarify, mcp_firecrawl_* ]

  "10_context_analysis":
    require_before: [7_5_image_assets]
    do: |
      发文文本分析：集合全网平台（validated_accounts）的发文信息，归纳发文点位，分析该账号的
      真实姓名、年龄、籍贯、常住地、活动城市、生活习惯、教育经历、工作经历、对华态度、电话邮箱码值，
      以及社交/亲友/同事三个圈层关系。
      输出要求：
      - 每个点位：结论 + 至少 1 条发文佐证，格式「YYYY年MM月DD日 在 XX平台 发文称："原文摘录"」
      - 无佐证的点位标注「未获取/证据不足」，禁止臆测
    forbid: [ web_search, web_extract, browser_*, clarify, mcp_firecrawl_* ]

  "11_output":
    once: true
    require_before: [7_5_image_assets]
    sections: [一、账号基本信息, 二、账号全网关联账号, 三、账号网络活动情况, 四、核查思路]
    must_start_with: "一、账号基本信息"
    section1: |
      一、账号基本信息 含两个子节：
      - 1.1 profile 信息：昵称、简介、粉丝数、认证状态、头衔、外链（账号层面信息）
      - 1.2 发文特征：最早发帖时间、发帖频率、活跃时间段、发文语种
      若上下文有【社工库命中摘要】，揉进 1.1 或「四、核查思路」，勿单开「社工库」专节；无命中可不写或一句未命中
      终稿正文必须以「一、账号基本信息」或「## 一、账号基本信息」开头，禁止前置进度句/管线摘要
    section2: [1.1 账号信息, 1.2 账号发文情况,  2.1纳入采集的账号, 2.2文本流表, 2.3图片流表, ]
    section3: 每平台一块，MCP/Apify 依照主题归纳的行文形式；有视频分析成功结果时须含「### 视频观察」
    forbid_in_body: [步骤 7.5, 图片资产管线, 图片管线, 未部署, 未注册, 跳过步骤, image_pipeline, force-analyze, Hook, 命令行, ModuleNotFoundError, 任务 ID, task_id, collect_images, ---, mcp_video2frame]

apify:
  contract: [mcp_apify_<actor>, mcp_apify_get_actor_run, mcp_apify_get_dataset_items]
  instagram: { tool: mcp_apify_apify__instagram_scraper, input: { directUrls: ["https://www.instagram.com/{u}/"], resultsLimit: 5 } }
  tiktok: { tool: mcp_apify_clockworks__tiktok_scraper, input: { profiles: ["https://www.tiktok.com/@{u}"], resultsPerPage: 5 } }
  telegram: { tool: mcp_apify_vujeen__telegram_channel_scraper, input: { channels: ["{ch}"], maxPostsPerChannel: 3 } }
  facebook: { tool: mcp_apify_headlessagent__facebook_profile_post_scraper }
  github: { tool: mcp_apify_knotless_cadence__github_profile_scraper }

midflight: 步骤1-10 每步向用户输出 1-2 句进度（如"步骤4完成：采集N个候选profile"）；禁止在步骤1-10 输出最终报告的任何章节（一/二/三/四）；步骤11 才一次性输出完整报告
